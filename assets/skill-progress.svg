  <text x="70" y="18" font-size="22" font-family="Georgia" fill="#5A3D46">NumPy</text>
  <rect x="70" y="30" width="650" height="18" rx="9" fill="#F7DCE7"/>
  <rect x="70" y="30" width="488" height="18" rx="9" fill="url(#fill)"/>
  <text x="740" y="44" font-size="18" font-family="Georgia" fill="#E86A92">55%</text>
  <text x="543" y="44" font-size="18">💗</text>
</g>

