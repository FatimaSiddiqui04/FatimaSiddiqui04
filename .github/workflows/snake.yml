name: 🌸 Generate Pink Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: FatimaSiddiqui04
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=FF69B4&color_dots=#ebedf0,#ffe8f2,#ffbfd7,#ff8fb1,#e86a92

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
